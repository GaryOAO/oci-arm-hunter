name: Hunt Oracle Always Free capacity (ARM + x86)

on:
  # A long polling window bridges GitHub's delayed scheduled events.
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      max_attempts:
        description: 'Launch attempts (0 = until runtime limit)'
        default: '0'
      sleep_seconds:
        description: 'Minimum delay between attempts (at least 10 seconds)'
        default: '15'
      max_runtime_seconds:
        description: 'Polling window in seconds (1–3300)'
        default: '3300'

permissions:
  contents: read

concurrency:
  group: oci-arm-hunter
  # Keep the active hunter alive; one pending job continues after it finishes.
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install OCI SDK
        run: python -m pip install --quiet -r requirements.txt
      - name: Test hunter
        run: python -m unittest discover -s tests -v

      # No credentials are cached, only pending request metadata/retry token.
      - uses: actions/cache/restore@v4
        with:
          path: .hunt-state
          key: oci-hunt-state-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: oci-hunt-state-v1-

      - name: Write API private key
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"

      - name: Hunt for free capacity
        id: hunt
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION || 'us-sanjose-1' }}
          COMPARTMENT_OCID: ${{ vars.OCI_COMPARTMENT_OCID }}
          AD: ${{ vars.OCI_AD || 'auto' }}
          SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          IMAGE_OCID: ${{ vars.OCI_IMAGE_OCID }}
          X86_IMAGE_OCID: ${{ vars.OCI_X86_IMAGE_OCID }}
          SSH_PUBLIC_KEY: ${{ vars.OCI_SSH_PUBLIC_KEY }}
          INSTANCE_NAME: ${{ vars.OCI_INSTANCE_NAME || 'ubuntu-arm-free' }}
          SHAPES: ${{ vars.OCI_SHAPES || 'VM.Standard.A1.Flex,VM.Standard.E2.1.Micro' }}
          OCPUS: ${{ vars.OCI_OCPUS || '2' }}
          MEMORY_GB: ${{ vars.OCI_MEMORY_GB || '12' }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts || '0' }}
          SLEEP_SECONDS: ${{ inputs.sleep_seconds || '15' }}
          MAX_RUNTIME_SECONDS: ${{ inputs.max_runtime_seconds || '3300' }}
        run: |
          export OCI_CLI_KEY_FILE="$HOME/.oci/oci_api_key.pem"
          python scripts/hunt.py

      - uses: actions/cache/save@v4
        if: always() && hashFiles('.hunt-state/request.json') != ''
        with:
          path: .hunt-state
          key: oci-hunt-state-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.hunt.outputs.result }}
          INSTANCE_ID: ${{ steps.hunt.outputs.instance_id }}
          SHAPE: ${{ steps.hunt.outputs.shape }}
          STATE: ${{ steps.hunt.outputs.lifecycle_state }}
          ATTEMPTS: ${{ steps.hunt.outputs.attempts }}
          CAPACITY: ${{ steps.hunt.outputs.capacity }}
          THROTTLED: ${{ steps.hunt.outputs.throttled }}
          TRANSIENT: ${{ steps.hunt.outputs.transient }}
          QUOTA: ${{ steps.hunt.outputs.quota }}
        run: |
          {
            echo '## Oracle Always Free hunt'
            echo "- result: ${RESULT:-step_failed}"
            echo "- instance: ${INSTANCE_ID:-none}"
            echo "- shape / state: ${SHAPE:-none} / ${STATE:-none}"
            echo "- attempts: ${ATTEMPTS:-0}"
            echo "- no capacity / throttled / transient / quota: ${CAPACITY:-0} / ${THROTTLED:-0} / ${TRANSIENT:-0} / ${QUOTA:-0}"
            echo "- ran at: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove private key
        if: always()
        run: rm -f "$HOME/.oci/oci_api_key.pem"
