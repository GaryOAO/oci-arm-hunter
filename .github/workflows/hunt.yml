name: Hunt Oracle ARM (A1.Flex) capacity

on:
  # Poll every 5 minutes. This repository is public, so GitHub-hosted
  # minutes are free and unlimited, and there is no reason to be sparing.
  #
  # Caveats, both inherent to GitHub cron:
  #   - 5 minutes is the shortest interval GitHub supports.
  #   - Scheduled runs are queued on a shared pool and routinely start a
  #     few minutes late, especially on the hour.
  schedule:
    - cron: '*/5 * * * *'
  # Allow manual runs from the Actions tab / CLI.
  workflow_dispatch:
    inputs:
      max_attempts:
        description: 'How many launch attempts per run'
        required: false
        default: '10'
      sleep_seconds:
        description: 'Seconds between attempts'
        required: false
        default: '30'

concurrency:
  # Never let two hunters fight each other (and trip Oracle's rate limits).
  # cancel-in-progress: true means a newer run supersedes a stuck/queued one,
  # so a job that never obtains a runner cannot block the queue forever.
  group: oci-arm-hunter
  cancel-in-progress: true

jobs:
  hunt:
    # GitHub-hosted runner. This repository is public, so hosted minutes are
    # free and unlimited. (The Lightsail self-hosted runner is reserved for
    # the private claude-oauth-proxy repo, whose minutes are metered.)
    runs-on: ubuntu-latest
    # Well under the 5-minute cron interval, so runs cannot pile up.
    timeout-minutes: 8

    steps:
      - uses: actions/checkout@v4

      - name: Install OCI CLI
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet oci-cli
          oci --version

      - name: Write API private key
        env:
          OCI_API_PRIVATE_KEY: ${{ secrets.OCI_API_PRIVATE_KEY }}
        run: |
          mkdir -p "$HOME/.oci"
          printf '%s\n' "$OCI_API_PRIVATE_KEY" > "$HOME/.oci/oci_api_key.pem"
          chmod 600 "$HOME/.oci/oci_api_key.pem"
          # sanity: make sure it looks like a PEM key
          head -1 "$HOME/.oci/oci_api_key.pem"

      - name: Hunt for capacity
        id: hunt
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_FILE: ${{ github.workspace }}/.oci_key.pem
          OCI_CLI_REGION: ${{ vars.OCI_CLI_REGION || 'us-sanjose-1' }}
          AD: ${{ vars.OCI_AD || 'pUWP:US-SANJOSE-1-AD-1' }}
          SUBNET_OCID: ${{ vars.OCI_SUBNET_OCID }}
          IMAGE_OCID: ${{ vars.OCI_IMAGE_OCID }}
          INSTANCE_NAME: ${{ vars.OCI_INSTANCE_NAME || 'ubuntu-arm-free' }}
          OCPUS: ${{ vars.OCI_OCPUS || '2' }}
          MEMORY_GB: ${{ vars.OCI_MEMORY_GB || '12' }}
          # Keep one run short: with a 5-minute cron, a long run would
          # overlap the next one and the queue would grow.
          MAX_ATTEMPTS: ${{ github.event.inputs.max_attempts || '6' }}
          SLEEP_SECONDS: ${{ github.event.inputs.sleep_seconds || '30' }}
        run: |
          cp "$HOME/.oci/oci_api_key.pem" "$OCI_CLI_KEY_FILE"
          chmod 600 "$OCI_CLI_KEY_FILE"
          bash scripts/hunt.sh

      - name: Summary
        if: always()
        run: |
          {
            echo "## Oracle ARM hunt"
            echo ""
            echo "- result: \`${{ steps.hunt.outputs.created }}\`"
            echo "- instance id: \`${{ steps.hunt.outputs.instance_id }}\`"
            echo "- ran at: $(date -u '+%Y-%m-%d %H:%M:%SZ')"
          } >> "$GITHUB_STEP_SUMMARY"
