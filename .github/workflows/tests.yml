name: Test free capacity hunter
on:
  push:
    paths: ['scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
  pull_request:
    paths: ['scripts/**', 'tests/**', 'requirements.txt', '.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
